services:
  # ─── Frontend (TanStack Start / Vite SSR) ───────────────────────────────────
  - type: web
    name: gic-frontend
    runtime: node
    region: frankfurt
    buildCommand: npm install && npm run build
    startCommand: npm run preview -- --port $PORT --host
    envVars:
      - key: VITE_API_URL
        value: https://gic-backend.onrender.com
      - key: VITE_MEMBER_APP_URL
        value: https://gic-frontend.onrender.com
      - key: VITE_ADMIN_APP_URL
        value: https://gic-frontend.onrender.com
      # Firebase web config (from your GIC Firebase project)
      - key: VITE_FIREBASE_API_KEY
        sync: false
      - key: VITE_FIREBASE_AUTH_DOMAIN
        sync: false
      - key: VITE_FIREBASE_PROJECT_ID
        sync: false
      - key: VITE_FIREBASE_STORAGE_BUCKET
        sync: false
      - key: VITE_FIREBASE_MESSAGING_SENDER_ID
        sync: false
      - key: VITE_FIREBASE_APP_ID
        sync: false
      - key: VITE_FIREBASE_VAPID_KEY
        sync: false

  # ─── Backend API (Hono + Node.js) ───────────────────────────────────────────
  - type: web
    name: gic-backend
    runtime: node
    region: frankfurt
    rootDir: gic-backend
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: gic-postgres
          property: connectionString
      - key: MEMBER_APP_URL
        value: https://gic-frontend.onrender.com
      - key: ADMIN_APP_URL
        value: https://gic-frontend.onrender.com
      # Firebase Admin SDK service account (paste full JSON as single-line string)
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      # JWT secret — generate: openssl rand -hex 64
      - key: JWT_SECRET
        sync: false

  # ─── PostgreSQL Database ─────────────────────────────────────────────────────
databases:
  - name: gic-postgres
    region: frankfurt
    plan: starter
    databaseName: gic_db
    user: gic_user
